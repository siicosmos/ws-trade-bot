# test modes: minimum | essential | full (default run = full)
#
#   .venv/bin/python -m pytest tests -q -m minimum     # install alive
#   .venv/bin/python -m pytest tests -q -m essential   # + core behavior
#   .venv/bin/python -m pytest tests -q                # everything
#
# minimum tests live inside essential modules and carry both
# markers, so -m essential includes them (minimum ⊂ essential ⊂
# full). unmarked tests are full-only.
[pytest]
markers =
    minimum: smoke set - configs load, alerts parse, settings save
    essential: core behavior - parser, settings, reader, stops, users, feed
addopts = -p no:cacheprovider
