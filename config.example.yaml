pipeline:
  host: "0.0.0.0"
  port: 8080
  auth_token: ""

reader:
  pipeline_url: "http://localhost:8080/alert"
  poll_interval: 0.5
  channel_marker: ""
  max_items: 40
  auth_token: ""

discord:
  webhook_url: "YOUR_PRIVATE_SERVER_WEBHOOK_URL"

trading:
  mode: notify
  order_type: limit
  limit_offset_pct: 0.5
  position_size_cad: 100
  risk_per_trade_pct: 5
  size_tiers:
    lotto:
      risk_pct_max: 0.5
      contracts_min: 1
      contracts_max: 1
    tiny:
      risk_pct_max: 1
      contracts_min: 1
      contracts_max: 1
    small:
      risk_pct_max: 2
      contracts_min: 1
      contracts_max: 2
    medium:
      risk_pct_max: 5
      contracts_min: 1
      contracts_max: 5
    large:
      risk_pct_max: 10
      contracts_min: 1
      contracts_max: 10
  max_contracts_per_trade: 10
  max_open_risk_pct: 30
  paper_account_value: 10000
  skip_underlyings:
    - SPX
  max_trades_per_day: 5
  cooldown_seconds: 60
  dedupe_window_minutes: 10
  ticker_whitelist: []
  sell_only_if_held: true
  place_stop_loss: false

wealthsimple:
  accounts:
    - account_id: "YOUR_RRSP_ACCOUNT_ID"
      label: "RRSP"
      max_contracts_per_trade: 20
      paper_value: 50000
    - account_id: "YOUR_PERSONAL_ACCOUNT_ID"
      label: "Personal"
      paper_value: 2000
  exchange_hint: ""

parser:
  custom_patterns: []
