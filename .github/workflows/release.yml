name: release-consumer

# rolling consumer client release: rebuilt on every push to main,
# the client updater polls /releases/latest for the new asset
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        run: |
          set -o pipefail
          python -m pytest tests -q --ignore=tests/scripts -rf \
            2>&1 | tee pytest.log

      - name: Surface failed tests as annotations
        if: failure()
        run: |
          # head -10: github caps error annotations at 10 per
          # step; the || true keeps a short grep from reporting
          # SIGPIPE as a step failure if pipefail is ever added
          grep -E "^(FAILED|ERROR)" pytest.log | head -10 \
            > failed_tests.txt || true
          while IFS= read -r line; do
            echo "::error::$line"
          done < failed_tests.txt

      - name: Black-box e2e (boots the real server)
        run: python tests/scripts/e2e_test.py

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build consumer zip
        run: python scripts/build_consumer_zip.py dist

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # recreate the release so /releases/latest always has
          # exactly the newest asset (a client polling during the
          # gap sees a 404 and retries next cycle)
          gh release delete consumer-latest --cleanup-tag -y || true
          gh release create consumer-latest \
            --title "consumer-latest" \
            --notes "Automated consumer client build of ${GITHUB_SHA::8}" \
            --target "$GITHUB_SHA" \
            dist/consumer-*.zip dist/SHA256SUMS