<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WS Trade Bot</title>
<link rel="stylesheet" href="/static/dashboard.css">

</head>
<body>
<header>
  <div class="headrow">
    <h1 style="margin:0">WS Trade Bot</h1>
    <span id="mode" class="badge notify">notify</span>
    <span id="paper-badge" class="badge papersim" style="display:none">paper</span>
    <span id="timebox"><span id="clock"></span></span>
  </div>
  <div class="headrow" style="color:var(--muted);font-size:12px;gap:18px">
    <span id="reader"></span>
    <span id="git"></span>
  </div>
  <div class="headrow" style="color:var(--muted);font-size:12px;gap:18px">
    <span id="updated">data refreshed</span>
    <span id="stops"></span>
  </div>
  <div class="headrow" style="justify-content:flex-end;gap:10px">
    <button id="settings-btn" onclick="openSettings()">settings</button>
    <a href="/logout" id="logout">log out</a>
  </div>
</header>

<div class="cards" id="accounts"></div>

<h2>Open Positions</h2>
<div id="positions"></div>

<h2 style="display:flex;justify-content:space-between;align-items:center"><span>Stock Holdings</span><button id="toggle-stocks" onclick="toggleStocks()" style="background:#21262d;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 14px;font-size:12px;cursor:pointer">Show holdings</button></h2>
<div id="stock-positions"></div>

<h2 style="display:flex;justify-content:space-between;align-items:center"><span>Recent Alerts</span><span><button id="toggle-alerts" onclick="toggleAlerts()" style="background:#21262d;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 14px;font-size:12px;cursor:pointer">Hide</button> <button id="toggle-ignored" onclick="toggleIgnored()" style="background:#21262d;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 14px;font-size:12px;cursor:pointer">Hide ignored</button></span></h2>
<div id="signals"></div>

<h2 style="display:flex;justify-content:space-between;align-items:center"><span>Trade Log</span><button id="toggle-trades" onclick="toggleTrades()" style="background:#21262d;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 14px;font-size:12px;cursor:pointer">Hide</button></h2>
<div id="trades"></div>

<h2>History Search</h2>
<div class="card" id="history-search" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px">
  <input id="hs-q" placeholder="free text" onkeydown="if(event.key==='Enter')runHistorySearch()" style="min-width:140px">
  <input id="hs-ticker" placeholder="ticker" onkeydown="if(event.key==='Enter')runHistorySearch()" style="width:70px;text-transform:uppercase">
  <select id="hs-status" title="filter trades by result status (alerts are unaffected)">
    <option value="">any status</option>
    <option value="executed">executed</option>
    <option value="skipped">skipped</option>
    <option value="error">error</option>
    <option value="notified">notified</option>
  </select>
  <input type="date" id="hs-since" title="from date">
  <input type="date" id="hs-until" title="to date (inclusive)">
  <button onclick="runHistorySearch()">Search</button>
  <button onclick="clearHistorySearch()">Clear</button>
</div>
<div id="history-results"></div>

<div id="settingsBackdrop" onclick="if(event.target===this) requestCloseSettings()">
  <div id="settingsPanel">
    <div id="settingsHead"><span>Settings</span><button id="settingsClose" onclick="requestCloseSettings()">&#215;</button></div>
    <div id="settingsScroll"><div id="settings" class="card"></div></div>
    <div id="settings-float">
      <button id="settings-revert">Revert</button>
      <button id="settings-save">Save</button>
    </div>
  </div>
</div>
<div id="modalBackdrop" onclick="if(event.target===this) closeModal()">
  <div id="modalBox">
    <div class="mtitle" id="mTitle"></div>
    <div class="mtext" id="mText"></div>
    <div class="mrow">
      <button onclick="closeModal()"
        style="background:#21262d;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer">cancel</button>
      <button id="mGo" onclick="var a=modalAction; closeModal(); if(a) a();"
        style="background:#da3633;color:#fff;border:1px solid #da3633;border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer">reset</button>
    </div>
  </div>
</div>
<div id="reconnect" style="display:none;position:fixed;top:0;left:0;right:0;z-index:200;background:#d29922;color:#111;text-align:center;font-size:12px;font-weight:700;padding:6px 8px;box-shadow:0 2px 8px rgba(0,0,0,.4)">server unreachable — reconnecting…</div>
<script src="/static/dashboard.js"></script>
</body>
</html>
