# ---------------------------------------------------------------------------
# info server example config - copy to config/info.config.yaml and edit
#
# the alert source: the reader posts Discord messages here, this
# server parses + records them and serves the alert feed that
# consumer apps pull from. No trading wiring - no executors, no
# stop monitor, no quotes. Sections that do not apply to this role
# are omitted - they get safe defaults.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# info - this app's web server: reader ingest + alert feed + the
# admin dashboard. the section name IS the role (the consumer's
# config uses consumer:)
# ---------------------------------------------------------------------------
info:
  host: "0.0.0.0"            # what to bind to; 127.0.0.1 = this PC only
  port: 8081                 # the reader posts here (reader.info_server_url); the consumer owns 8080
  auth_token: ""             # the reader's credential + dashboard password.
                             # REQUIRED (the server refuses to start without it).
                             # generate: python -c "import secrets; print(secrets.token_urlsafe(24))"
  tls_cert: ""               # HTTPS: paths from scripts/gen_cert.py, e.g.
  tls_key: ""                # "certs/dashboard.crt" / "certs/dashboard.key".
                             # empty = plain HTTP

# ---------------------------------------------------------------------------
# consumers - apps allowed to read the alert feed. token
# authenticates both directions (their feed client against this
# server; this server's push against their /alert endpoint).
# push_url empty = pull-only consumer (they long-poll the feed).
# ---------------------------------------------------------------------------
consumers:
  - label: owner
    token: "GENERATE_A_TOKEN"
    push_url: "http://127.0.0.1:8080/alert"   # the consumer's /alert route
    # push_verify_ssl: true   # verify the consumer's TLS cert on push
    #                          (off by default - the self-signed dev
    #                          certs fail verification; a proper CA or
    #                          Tailscale cert turns it on)

# ---------------------------------------------------------------------------
# auto_update - the info server is a git checkout: fetch +
# ff-only pull every interval, restart when its code changed.
# the pull updates the whole repo on disk - the reader (which
# runs no updater of its own) notices and restarts itself
# ---------------------------------------------------------------------------
auto_update:
  enabled: true
  interval_seconds: 600      # how often to check GitHub for updates

# ---------------------------------------------------------------------------
# discord - webhooks that send notifications to your private server
# ---------------------------------------------------------------------------
discord:
  consumer_log_webhook_url: ""  # this app's log tail (info.log) posted to
                                # discord; empty = off
  update_webhook_url: ""        # server update/restart notices; empty = off

# ---------------------------------------------------------------------------
# trading - the info server only reads history_retention_days from
# here (the daily prune of recorded signals); everything else stays
# defaulted
# ---------------------------------------------------------------------------
trading:
  history_retention_days: 365

# ---------------------------------------------------------------------------
# parser - extra regex patterns for alert formats the built-in parser misses
# ---------------------------------------------------------------------------
parser:
  custom_patterns: []